<aside class="sidebar">
  <div class="sidebar-header">
    <svg class="brand-mark" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="brandOGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#6ea8ff"></stop>
          <stop offset="55%" stop-color="#4f8ef7"></stop>
          <stop offset="100%" stop-color="#14224a"></stop>
        </linearGradient>
      </defs>
      <ellipse cx="28" cy="25" rx="13" ry="17.5" fill="none" stroke="#7c8aa8" stroke-width="8.5" opacity="0.5" transform="rotate(20 28 25)"></ellipse>
      <ellipse cx="20" cy="23" rx="13" ry="17.5" fill="none" stroke="url(#brandOGradient)" stroke-width="8.5" transform="rotate(-20 20 23)"></ellipse>
    </svg>
    <span class="brand-name">Outa Mortgage <span class="brand-name__poc">POC</span></span>
  </div>

  <nav class="sidebar-nav">
    @for (module of visibleModules(); track module.label) {
      <div class="nav-module">
        @if (module.path) {
          <a
            class="nav-item"
            [class.active]="isActiveModule(module)"
            [routerLink]="module.path">
            <span class="nav-icon"><app-icon [name]="module.icon"></app-icon></span>
            <span class="nav-label">{{ module.label }}</span>
          </a>
        } @else {
          <button
            type="button"
            class="nav-item nav-item-expandable"
            [class.active]="isActiveModule(module)"
            (click)="toggleModule(module)">
            <span class="nav-icon"><app-icon [name]="module.icon"></app-icon></span>
            <span class="nav-label">{{ module.label }}</span>
            <span class="chevron" [class.rotated]="isExpanded(module)">&#9660;</span>
          </button>

          @if (isExpanded(module)) {
            <div class="sub-modules">
              <button type="button" class="collapse-btn" (click)="collapse()">
                &#9650; Collapse
              </button>
              @for (sub of module.subModules; track sub.path) {
                <a
                  class="sub-nav-item"
                  [class.active]="isActiveSubModule(sub.path)"
                  [routerLink]="sub.path">
                  <span class="sub-nav-icon"><app-icon [name]="sub.icon"></app-icon></span>
                  <span class="sub-nav-label">{{ sub.label }}</span>
                </a>
              }
            </div>
          }
        }
      </div>
    }
  </nav>

  <div class="sidebar-footer">
    <a routerLink="/my-profile" class="profile-link" routerLinkActive="active">
      <span class="nav-icon"><app-icon name="profile"></app-icon></span>
      My Profile
    </a>
    <button type="button" class="logout-btn" (click)="logout()">
      <span>&#10148;</span> Logout
    </button>
  </div>
</aside>
