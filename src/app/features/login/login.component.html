<div class="login-wrapper">
  <div class="login-card">
    <div class="brand">
      <span class="brand-icon">&#9670;</span>
      <span class="brand-text">Outamation Mortgage Portal</span>
    </div>

    <!-- STEP 1: EMAIL -->
    @if (step() === 'email') {
      <form [formGroup]="emailForm" (ngSubmit)="submitEmail()" class="step-form" appAutofocus appEnterSubmit>
        <h2>Sign in</h2>
        <label>Email <span class="req">*</span></label>
        <input
          type="text"
          formControlName="email"
          placeholder="Enter your email"
          (input)="credentialError.set(null)"
          [class.invalid]="(emailControl.invalid && submitted()) || credentialError()" />
        <button type="submit" class="btn-primary full-width">Submit</button>
      </form>
    }

    <!-- STEP 2: PASSWORD -->
    @if (step() === 'password') {
      <form [formGroup]="passwordForm" (ngSubmit)="submitPassword()" class="step-form" appAutofocus appEnterSubmit>
        <h2>Enter Password</h2>
        <p class="sub-text">Signing in as {{ emailForm.value.email }}</p>
        <label>Password <span class="req">*</span></label>
        <input
          type="password"
          formControlName="password"
          placeholder="Enter your password"
          (input)="credentialError.set(null)"
          [class.invalid]="(passwordControl.invalid && submitted()) || credentialError()" />
        <button type="submit" class="btn-primary full-width">Submit</button>
        <button type="button" class="btn-link" (click)="backToEmail()">&larr; Back to Email</button>
      </form>
    }

    <!-- STEP 3: CONFIRM -->
    @if (step() === 'confirm') {
      <div class="step-form confirm-step" appAutofocus>
        <h2>Are you sure you want to proceed with Login?</h2>
        <div class="confirm-actions">
          <button type="button" class="btn-secondary" (click)="confirmNo()">No</button>
          <button type="button" class="btn-primary" (click)="confirmYes()">Yes</button>
        </div>
      </div>
    }
  </div>
</div>
